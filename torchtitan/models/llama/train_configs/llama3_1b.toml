# TorchTitan Config for LLaMA-3 1B
# Optimized for 4x A100 GPUs

[job]
dump_folder = "./outputs"
description = "Llama 3 1B base training"

[profiling]
enable_profiling = true
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 10
enable_tensorboard = true
save_tb_folder = "tb"

[model]
name = "llama3"
flavor = "1B"
norm_type = "rmsnorm"
tokenizer_path = "./assets/tokenizer/original/tokenizer.model"

[optimizer]
name = "AdamW"
lr = 3e-4  

[training]
batch_size = 10  
seq_len = 4096  
warmup_steps = 200  # Smooth warmup for stable learning rate
max_norm = 1.0  # Gradient clipping for stability
steps = 10_000
data_parallel_replicate_degree = 1  # Follow standard LLaMA-3 setup
data_parallel_shard_degree = -1
tensor_parallel_degree = 2  # Balance compute across 4 GPUs
compile = false 
dataset = "c4"

[experimental]
context_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
enable_checkpoint = true
folder = "checkpoint"
interval = 10_000  
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = 'selective'  # ['none', 'selective', 'full']
selective_ac_option = 'op'  # 'int' = ac every positive int layer or 'op', ac based on ops policy

[float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false